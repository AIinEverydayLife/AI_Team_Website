<script>
document.addEventListener("DOMContentLoaded", () => {
    // Title Split Animation
    const titles = document.querySelectorAll('.hh');
    let delay = 0.2; // 초기 딜레이
    
    titles.forEach(title => {
        const text = title.textContent.trim();
        title.innerHTML = '';
        const isNavbar = title.classList.contains('nav-brand');
        const offset = isNavbar ? '6px' : '10px';
        const blurVal = isNavbar ? '6px' : '8px';
        
        [...text].forEach(char => {
            const span = document.createElement('span');
            if (char === ' ') {
                span.innerHTML = '&nbsp;';
            } else {
                span.textContent = char;
            }
            if (char === 'A' || char === 'I') {
                span.classList.add('ai-bounce-char');
                span.style.animationDelay = `${delay}s`;
            } else {
                span.style.opacity = '0';
                span.style.filter = `blur(${blurVal})`;
                span.style.display = 'inline-block';
                span.style.transform = `translateY(${offset})`;
                span.style.transition = 'opacity 0.5s ease-out, filter 0.5s ease-out, transform 0.5s ease-out';
                span.style.transitionDelay = `${delay}s`;
            }
            title.appendChild(span);
            delay += 0.15; // 글자당 간격
        });
        delay += 0.1; // 단어 사이 약간의 틈
    });

    // 렌더링 직후 실행하여 애니메이션 트리거
    setTimeout(() => {
        document.querySelectorAll('.hh span:not(.ai-bounce-char)').forEach(span => {
            span.style.opacity = '1';
            span.style.filter = 'blur(0px)';
            span.style.transform = 'translateY(0)';
        });
        document.querySelectorAll('.hh span.ai-bounce-char').forEach(span => {
            span.classList.add('animate');
        });
    }, 50);
});
</script>
